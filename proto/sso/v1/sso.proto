syntax="proto3"; //tag for protobuf version

package github.com.Ar1an03.protos.proto.v1; // define package for proto gen files

option go_package="github.com/Ar1an03/protos/gen/sso/v1;ssov1";

service Auth {
  rpc Register (RequestRegister) returns (ResponseRegister);
  rpc Login (RequestLogin) returns (ResponseLogin);
  rpc Logout (RequestLogout) returns (ResponseLogout);
  rpc IsAdmin (RequestIsAdmin) returns (ResponseIsAdmin);
}

message RequestRegister {
  string name = 1;
  int64 age = 2;
  string password = 3;
  string email = 4;
}

message ResponseRegister {
  string userID = 1;
}

message RequestLogin {
  string password = 1;
  string email = 2;
  int32 appID = 3;
}

message ResponseLogin {
  string token = 1;
}

message RequestLogout {
  string token = 1;
}

message ResponseLogout {
  bool success = 1;
}

message RequestIsAdmin {
  int64 userID = 1;
}

message ResponseIsAdmin {
  bool isAdmins = 1;
}